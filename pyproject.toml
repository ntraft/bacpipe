[project]
name = "bacpipe"
version = "1.3.5"
description = "Use bacpipe to streamline the process of generating embeddings and analysing your PAM datasets."
readme = "README.md"
authors = [
    { name = "Vincent S. Kather", email = "vkather@gmail.com" }
]
requires-python = ">=3.11"

dependencies = [
    "apache-beam",
    "einops",
    "flax",
    "gdown",
    "httpx",
    "importlib-resources",
    "kagglehub",
    "keras-cv",
    "librosa",
    "ml-collections",
    "numba",
    "panel",
    "plotly",
    "pysocks",
    "pytest",
    "seaborn",
    "sounddevice",
    "streamlit",
    "tensorflow[and-cuda]",
    "tensorflow-hub",
    "tensorflow-io",
    "timm",
    "torch",
    "torchaudio",
    "torchcodec",
    "torchvision",
    "transformers",
    "umap-learn",
    "uvicorn",
    "uvloop; sys_platform != 'win32'",
    "zipp",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "/bacpipe",
    "run_pipeline.py",
    "/bacpipe/imgs/bacpipe_favicon_white.png",
    "/bacpipe/imgs/bacpipe_unlabelled.png"
]
exclude = [
    "*.gif",
    "*.jpg",
    "*.jpeg",
    "bacpipe.egg-info",
    "bacpipe/model_checkpoints",
    "bacpipe/examples"
]

[tool.hatch.build.targets.sdist]
include = [
    "/bacpipe",
    "run_pipeline.py",
    "/bacpipe/imgs/bacpipe_favicon_white.png",
    "/bacpipe/imgs/bacpipe_unlabelled.png"
]
exclude = [
    "*.gif",
    "*.jpg",
    "*.jpeg",
    "bacpipe.egg-info",
    "bacpipe/model_checkpoints",
    "bacpipe/examples"
]

[tool.black]
line-length = 79
