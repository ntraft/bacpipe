[project]
name = "bacpipe"
version = "1.3.5"
description = "Use bacpipe to streamline the process of generating embeddings and analysing your PAM datasets."
readme = "README.md"
authors = [
    { name = "Vincent S. Kather", email = "vkather@gmail.com" }
]
requires-python = ">=3.11"

dependencies = [
    "apache-beam",
    "einops",
    "flax",
    "gdown",
    "httpx",
    "importlib-resources",
    "kagglehub",
    "keras-cv",
    "librosa",
    "ml-collections",
    "numba",
    "onnxruntime-gpu",
    "panel",
    "plotly",
    "pysocks",
    "pytest",
    "seaborn",
    "sounddevice",
    "streamlit",
    "tensorflow; sys_platform != 'linux' and sys_platform != 'darwin'",
    "tensorflow[and-cuda]; sys_platform == 'linux'",  # GPU is only supported on Linux.
    "tensorflow<=2.19.1; sys_platform == 'darwin'",  # Apple has a custom TF plugin, but is broken in TF 2.20.
    "tensorflow-metal; sys_platform == 'darwin'",
    "tensorflow-hub",
    "tensorflow-io",
    "timm",
    "torch",
    "torchaudio",
    "torchcodec",
    "torchvision",
    "transformers",
    "umap-learn",
    "uvicorn",
    "uvloop; sys_platform != 'win32'",
    "zipp",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "/bacpipe",
    "run_pipeline.py",
    "/bacpipe/imgs/bacpipe_favicon_white.png",
    "/bacpipe/imgs/bacpipe_unlabelled.png"
]
exclude = [
    "*.gif",
    "*.jpg",
    "*.jpeg",
    "bacpipe.egg-info",
    "bacpipe/model_checkpoints",
    "bacpipe/examples"
]

[tool.hatch.build.targets.sdist]
include = [
    "/bacpipe",
    "run_pipeline.py",
    "/bacpipe/imgs/bacpipe_favicon_white.png",
    "/bacpipe/imgs/bacpipe_unlabelled.png"
]
exclude = [
    "*.gif",
    "*.jpg",
    "*.jpeg",
    "bacpipe.egg-info",
    "bacpipe/model_checkpoints",
    "bacpipe/examples"
]

[tool.black]
line-length = 79

# NOTE: The two sections below are needed to specify a version of ONNX which is compatible with current versions of
#       Torch/Tensorflow, which use CUDA 12 (not CUDA 13).
[tool.uv.sources]
onnxruntime-gpu = { index = "ort-cuda-12" }

[[tool.uv.index]]
name = "ort-cuda-12"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/"

