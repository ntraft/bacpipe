[project]
name = "bacpipe"
version = "1.3.0.dev4"
description = "Use bacpipe to streamline the process of generating embeddings and analysing your PAM datasets."
readme = "README.md"
authors = [
    { name = "Vincent S. Kather", email = "vkather@gmail.com" }
]
requires-python = ">=3.11"

dependencies = [
    "apache-beam",
    "einops",
    "flax",
    "gdown",
    "httpx",
    "importlib-resources",
    "kagglehub",
    "keras-cv",
    "librosa",
    "ml-collections",
    "numba",
    "panel",
    "plotly",
    "pysocks",
    "pytest",
    "seaborn",
    "sounddevice",
    "streamlit",
    "tensorflow; sys_platform != 'linux' and sys_platform != 'darwin'",
    "tensorflow[and-cuda]; sys_platform == 'linux'",  # GPU is only supported on Linux.
    "tensorflow<=2.19.1; sys_platform == 'darwin'",  # Apple has a custom TF plugin, but is broken in TF 2.20.
    "tensorflow-metal; sys_platform == 'darwin'",
    "tensorflow-hub",
    "tensorflow-io",
    "timm",
    "torch",
    "torchaudio",
    "torchcodec",
    "torchvision",
    "transformers",
    "umap-learn",
    "uvicorn",
    "uvloop; sys_platform != 'win32'",
    "zipp",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bacpipe*"]

[tool.setuptools.package-data]
"bacpipe" = ["*.yaml", "*.png"]
"*" = ["*.txt", "*.csv"]